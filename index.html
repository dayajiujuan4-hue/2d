<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>杭州探索録 - 武林夜市</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="game-shell">

  <header class="game-header">
    <div>
      <p class="eyebrow">杭州探索録 · HANGZHOU EXPLORER</p>
      <h1>武林夜市</h1>
    </div>

    <div class="header-right">
      <span id="areaHeader">武林夜市・小吃街</span>
      <span id="clock">19:42</span>
    </div>
  </header>

  <section class="game-frame">

    <canvas
      id="gameCanvas"
      width="960"
      height="576"
    ></canvas>

    <div id="areaBanner" class="area-banner hidden">
      <small>AREA</small>
      <strong id="areaBannerName"></strong>
      <span id="areaBannerSub"></span>
    </div>

    <div id="interactionHint" class="interaction-hint hidden">
      <span class="key">E</span>
      <span id="interactionText">話す</span>
    </div>

    <div id="dialogueBox" class="dialogue-box hidden">

      <div class="portrait">
        <div id="portraitFace">人</div>
      </div>

      <div class="dialogue-content">
        <div id="speakerName" class="speaker-name"></div>
        <div id="dialogueText" class="dialogue-text"></div>
        <div class="dialogue-footer">E / ENTER</div>
      </div>

    </div>

    <div id="fadeLayer" class="fade-layer"></div>

  </section>

  <footer class="game-footer">

    <div>
      <span class="key">WASD</span>
      <span class="key">↑↓←→</span>
      移動
    </div>

    <div>
      <span class="key">E</span>
      話す・入る
    </div>

    <div class="footer-location">
      中国 · 浙江省 · 杭州市
    </div>

  </footer>

</main>

<script src="map.js"></script>
<script src="dialogue.js"></script>
<script src="game.js"></script>

</body>
</html>
